server:
  port: 9023
  servlet:
    context-path: /api/v1

spring:
  application:
    name: bread-factory-erp
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5433}/${POSTGRES_DB:bread_erp_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:erp_admin}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:erp_secret_password}}
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:${REDIS_HOST:127.0.0.1}}
      port: ${SPRING_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_REDIS_SSL_ENABLED:false}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:diww3cwqd}
  api-key: ${CLOUDINARY_API_KEY:182413739163318}
  api-secret: ${CLOUDINARY_API_SECRET:b6I9zFSccMcL-cMhpKAQ8_3_6wY}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
