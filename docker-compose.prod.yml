version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: b2b_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bread_erp_db}
      POSTGRES_USER: ${POSTGRES_USER:-erp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_secret_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_admin} -d ${POSTGRES_DB:-bread_erp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: b2b_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${GH_REPO_OWNER:-b2b}/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: b2b_backend_prod
    restart: always
    ports:
      - "9023:9023"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_ENDPOINT:-postgres}:5432/${POSTGRES_DB:-bread_erp_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-erp_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-erp_secret_password}
      SPRING_REDIS_HOST: ${ELASTICACHE_HOST:-redis}
      SPRING_REDIS_PORT: ${ELASTICACHE_PORT:-6379}
      SPRING_REDIS_PASSWORD: ${ELASTICACHE_PASSWORD:-}
      SPRING_REDIS_SSL_ENABLED: ${ELASTICACHE_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-diww3cwqd}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-182413739163318}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-b6I9zFSccMcL-cMhpKAQ8_3_6wY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin-dashboard:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${GH_REPO_OWNER:-b2b}/admin-dashboard:${IMAGE_TAG:-latest}
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: b2b_admin_dashboard_prod
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: b2b_prod_network
