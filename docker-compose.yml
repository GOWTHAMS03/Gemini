services:
  postgres:
    image: postgres:16-alpine
    container_name: b2b_postgres
    environment:
      POSTGRES_DB: bread_erp_db
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: erp_secret_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d bread_erp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: b2b_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: b2b_backend
    ports:
      - "9023:9023"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bread_erp_db
      SPRING_DATASOURCE_USERNAME: erp_admin
      SPRING_DATASOURCE_PASSWORD: erp_secret_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: b2b_admin_dashboard
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
